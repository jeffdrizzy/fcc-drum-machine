<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drum Machine</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.freecodecamp.org/testable-projects-fcc/v1/bundle.js"></script>
</head>
<body>
<div id="drum-machine">
  <h1>Drum Machine</h1>
  <div id="display">Press a pad</div>
  <div class="pads">
    <div class="drum-pad" id="Q">Q<audio class="clip" id="Heater-1" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3"></audio></div>
    <div class="drum-pad" id="W">W<audio class="clip" id="Heater-2" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-2.mp3"></audio></div>
    <div class="drum-pad" id="E">E<audio class="clip" id="Heater-3" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-3.mp3"></audio></div>
    <div class="drum-pad" id="A">A<audio class="clip" id="Heater-4" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-4_1.mp3"></audio></div>
    <div class="drum-pad" id="S">S<audio class="clip" id="Clap" src="https://s3.amazonaws.com/freecodecamp/drums/Heater-6.mp3"></audio></div>
    <div class="drum-pad" id="D">D<audio class="clip" id="Open-HH" src="https://s3.amazonaws.com/freecodecamp/drums/Dsc_Oh.mp3"></audio></div>
    <div class="drum-pad" id="Z">Z<audio class="clip" id="Kick-n-Hat" src="https://s3.amazonaws.com/freecodecamp/drums/Kick_n_Hat.mp3"></audio></div>
    <div class="drum-pad" id="X">X<audio class="clip" id="Kick" src="https://s3.amazonaws.com/freecodecamp/drums/RP4_KICK_1.mp3"></audio></div>
    <div class="drum-pad" id="C">C<audio class="clip" id="Closed-HH" src="https://s3.amazonaws.com/freecodecamp/drums/Cev_H2.mp3"></audio></div>
  </div>
  <p>Click a pad or press its key (Q W E A S D Z X C).</p>
</div>
<script src="script.js"></script>
</body>
</html>
